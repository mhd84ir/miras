# Simplified prose retelling — original work.
# r01 briefly recaps the division of the world already told in full in
# content/chapters/fereydoon/retelling.yaml (fereydoon.r03-r04); it is not
# re-authored at length here, only carried forward as a bridge.
sections:
  - id: iraj.r01
    body: >-
      فریدونِ فرزانه، در واپسین سالِ زندگی، جهان را میان سه پسر بخش کرد: روم
      و باختر را به سلم، توران و چین را به تور، و ایران‌زمین — بهترین و
      آبادترین بخش — را به ایرج، کهترین و محبوب‌ترین فرزندش سپرد. سلم و تور
      این بخش را برنتابیدند: چرا باید کهترین برادر، بهترین بخش را داشته
      باشد؟ رشک، آرام‌آرام، در دلشان ریشه دواند.
  - id: iraj.r02
    body: >-
      دلِ سلم از رشک به لرزه افتاد. فرستاده‌ای نزدِ تور، شاهِ چین، فرستاد و
      او را به هم‌داستانی خواند. هر دو برادر سرانجام فرستاده‌ای نزدِ فریدون
      گسیل داشتند: یا ایران را از ایرج پس بگیرد، یا لشکرِ روم و چین به
      کارزار خواهند آمد. فریدون، خشمگین اما فرزانه، فرستاده را با اندرزی
      دربارهٔ ناپایداریِ جهان بازگرداند — و آنگاه، دل‌شکسته، ایرج را نزدِ خود
      خواند تا از تهدیدِ برادرانش آگاهش کند.
  - id: iraj.r03
    body: >-
      فریدون به ایرج گفت: برادرانت جز به جنگ نمی‌اندیشند؛ گنج بگشای و آمادهٔ
      کارزار شو. اما ایرج پاسخی دیگر داد: روزگار چون باد می‌گذرد، چرا باید
      بر سرِ تاج و تخت خون ریخت؟ نگاه کن با جمشید چه کردند — غروری که فرّ او
      را بر باد داد. ایرج نه تاج خواست و نه سپاه؛ خواست بی‌هیچ لشکری نزدِ
      برادران برود و کینه را از دلشان بزداید. فریدون، دل‌نگران اما ناگزیر،
      نامه‌ای برای سلم و تور نوشت و ایرج را با چند تن همراه، به سوی برادران
      روانه کرد.
  - id: iraj.r04
    body: >-
      چون ایرج به نزدیکِ برادران رسید، از نیّتِ سیاهشان آگاه نبود. سپاهیانِ
      سلم و تور، به محضِ دیدنِ او، شیفتهٔ سیمای نیک و منشِ بزرگوارش شدند و
      آشکارا گفتند که تاج و تخت سزاوارِ اوست. همین ستایش، آتشِ رشکِ دو برادر
      را تیزتر کرد. تور بر ایرج تاخت: چرا باید کهتر، ایران و تختِ کیانی را
      داشته باشد؟ ایرج آرام و بی‌کینه پاسخ داد: من نه ایران می‌خواهم و نه
      تاج و تخت را؛ آیینِ من چیزی جز کهتری نیست. اما این فروتنی تور را رام
      نکرد — با کرسیِ زرین بر سرِ او کوفت، و چون ایرج زینهار خواست، خنجری
      آبگون برکشید و آن سروِ سهی را از پای درآورد. سرِ بریدهٔ ایرج را در
      تابوتی زرین نهادند و نزدِ فریدون فرستادند.
  - id: iraj.r05
    body: >-
      فریدون در انتظارِ بازگشتِ پیروزمندانهٔ پسر، تختی آراسته و جشنی برپا
      کرده بود که ناگاه سواری غمگین از راه رسید. چون پرنیانِ تابوت را کنار
      زدند، سرِ بریدهٔ ایرج پدیدار شد. فریدون از اسب بر خاک افتاد و سراسرِ
      سپاه جامه چاک زدند. سرِ پسر را در آغوش گرفت و رو به آسمان فریاد زد: ای
      داورِ دادگر، به این بی‌گناهِ کشته بنگر! گلستانِ خود را از ریشه برکند و
      سروهایی را که خود کاشته بود سوزاند — چشمِ شادی را برای همیشه بست.
      سراسرِ ایران‌زمین سیاه‌پوش شد و مردم چنان سوگوار شدند که زندگی را دیگر
      مرگ می‌پنداشتند.
