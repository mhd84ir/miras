# Chapter: ضحاک و کاوهٔ آهنگر
# Verse text sourced verbatim from Ganjoor (public domain):
#   /ferdousi/shahname/jamshid (sh2, sh3) and /ferdousi/shahname/zahak (sh1–sh12)
id: zahak
position: 2
title: "ضحاک و کاوهٔ آهنگر"
subtitle: "هزار سال بیداد و برخاستن درفش کاویانی"
summary: >-
  ابلیس جوانی سبکسار را می‌فریبد تا بر تخت پدر بنشیند؛ از بوسهٔ اهریمن دو مار
  بر کتف‌های ضحاک می‌روید و هزار سال بیداد بر ایران‌زمین سایه می‌افکند — تا
  آنکه آهنگری دادخواه چرم‌پارهٔ خود را بر سر نیزه می‌کند و جهان دگرگون می‌شود.
