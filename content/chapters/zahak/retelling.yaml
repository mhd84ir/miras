# Simplified prose retelling — original work.
sections:
  - id: zahak.r01
    body: >-
      در دشت سواران نیزه‌گذار، فرمانروایی نیک‌دل به نام مرداس می‌زیست که به
      داد و دهش نامدار بود. پسرش ضحاک اما جوانی دلیر و سبکسار بود. روزی ابلیس
      در چهرهٔ یک نیک‌خواه نزد او آمد و آن‌قدر در گوشش خواند تا ضحاک بر سر راه
      پدر چاهی پوشیده کند. مرداس شب‌هنگام به قصد نیایش به باغ رفت، در چاه
      افتاد و جان سپرد؛ و ضحاکِ فرومایه بدین نیرنگ جای پدر را گرفت.
  - id: zahak.r02
    body: >-
      ابلیس این بار در چهرهٔ خوالیگری چیره‌دست به دربار ضحاک راه یافت و
      خوراک‌هایی شگفت برایش پخت. چون شاه خواست پاداشش دهد، تنها یک آرزو کرد:
      بوسه زدن بر دو کتف او. اما از جای آن دو بوسه، دو مار سیاه رویید!
      پزشکان درماندند؛ آنگاه ابلیس در چهرهٔ پزشکی دانا بازآمد و گفت چارهٔ
      آرام کردن ماران تنها یک چیز است: مغز جوانان.
  - id: zahak.r03
    body: >-
      در همین روزگار، جمشیدِ شاه که سالیانی دراز به‌آیین رانده بود، گرفتار
      غرور شد و فرّ ایزدی از او گسست. بزرگان ایران که از او برگشته بودند،
      ضحاک را به شاهی خواندند — و هزار سال بیداد آغاز شد. در آن روزگار،
      کردار فرزانگان نهان گشت، هنر خوار شد و جادویی ارجمند؛ و هر روز دو
      جوان را می‌کشتند تا از مغزشان خوراک ماران بسازند.
  - id: zahak.r04
    body: >-
      چون از پادشاهی ضحاک چهل سال بیش نمانده بود، شبی در خواب دید که سه
      جنگاور از کاخ شاهنشاهان بیرون می‌آیند و کِهترِ آنان با گرزی گاوسر او را
      کشان‌کشان تا کوه دماوند می‌برد. موبدان سرانجام راز را گفتند: نام او
      فریدون است و هنوز زاده نشده! از آن پس ضحاک آرام نداشت. فریدون زاده شد؛
      پدرش را جلادان ضحاک کشتند، اما مادرش او را گریزاند و کودک با شیر
      گاو برمایه در کوهساران بالید.
  - id: zahak.r05
    body: >-
      ضحاکِ هراسان از فریدون، بزرگان را واداشت تا استشهادنامه‌ای (محضری)
      بنویسند و گواهی دهند که او شاهی دادگر است! درست در همان هنگام، فریاد
      دادخواهی از درگاه برخاست: کاوهٔ آهنگر، که هفده فرزندش را خوراک ماران
      کرده بودند و اینک نوبت آخرین پسرش بود. شاه برای خاموش کردنش پسر را
      بازداد و از او خواست محضر را گواهی کند؛ اما کاوه بر سرِ بزرگان خروشید،
      محضر را درید و زیر پا افکند. آنگاه پیش‌بند چرمی آهنگری‌اش را بر سر
      نیزه کرد و مردم را به سوی فریدون خواند — همان چرم‌پاره‌ای که فریدون
      بعدها به گوهر و دیبا آراست و «درفش کاویانی» نامیدش.
  - id: zahak.r06
    body: >-
      فریدون با گرز گاوسار خود بر پایتخت ضحاک تاخت، دژ او را گشود و دختران
      جمشید را از بندش رهاند. چون خواست ضحاک را بکشد، سروش خجسته فرارسید و
      گفت: «او را مکش؛ زمانش هنوز نیامده است. او را در کوه به بند کش.»
      فریدون ضحاک را به کوه دماوند برد و در غاری ژرف به بند کشید — تا نام
      ضحاک چون خاک شود و جهان از بدیِ او پاک گردد.
