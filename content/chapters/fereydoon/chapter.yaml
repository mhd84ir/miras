id: fereydoon
position: 3
title: "فریدون"
subtitle: "پانصد سال داد، و بخش کردن جهان"
summary: >-
  فریدون در مهرماه تاج بر سر نهاد و مهرگان را بنیاد گذاشت. پانصد سال چنان
  به داد فرمان راند که یک روز هم بنیادِ بد ننهاد. اما چون پیری رسید و جهان
  را میان سه پسر بخش کرد، دانهٔ رشکی کاشته شد که تراژدی‌های بعدی شاهنامه
  از آن رویید.
