# Simplified prose retelling — original work.
sections:
  - id: fereydoon.r01
    body: >-
      چون ضحاک در دماوند به بند شد، فریدون در روزی خجسته در آغاز مهرماه
      تاج کیانی بر سر نهاد. مردم آتش افروختند و جشن گرفتند — و آن جشن،
      مهرگان، چون نوروزِ جمشید برای ایرانیان یادگار ماند. مادرش فرانک که
      سال‌ها راز پسر را پنهان داشته بود، گنج گشود و بر درویشان بخشید.
  - id: fereydoon.r02
    body: >-
      پانصد سال فریدون بر جهان فرمان راند و حتی یک روز بنیادِ بد ننهاد.
      گرد جهان می‌گشت؛ هر جا بیداد می‌دید به داد بدل می‌کرد و هر بوم
      ناآباد را آباد می‌ساخت. گیتی را چون بهشت آراست و به جای گیاه خودرو،
      سرو و گلبن کاشت. فردوسی از دل داستان به ما رو می‌کند: جهان بر او هم
      نماند — پس آز مپرست و اندوه مخور.
  - id: fereydoon.r03
    body: >-
      فریدون را سه پسر بود: سلم و تور از شهرناز، و ایرجِ کهتر از ارنواز.
      چون پیری نزدیک شد، جهان را به سه بخش کرد: روم و خاور را به سلم داد،
      توران و چین را به تور، و ایران‌زمین — دل جهان — را به ایرج. برادرانِ
      مهتر این بخش را برنتابیدند؛ رشک در دلشان ریشه دواند.
  - id: fereydoon.r04
    body: >-
      فریدونِ فرزانه سالخورد شد؛ گرد پیری بر باغ بهارش نشست. داستانِ رشکِ
      سلم و تور بر ایرج، و آنچه بر سر آن جوانِ مهربان آمد، از تلخ‌ترین
      فصل‌های شاهنامه است — داستانی که نشان می‌دهد حتی پانصد سال داد نیز
      آز را از دل آدمی ریشه‌کن نمی‌کند.
