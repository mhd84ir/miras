id: fereydoon.l06
type: review
title: "مرور — از مهرگان تا بخشِ جهان"
exercises:
  - id: fereydoon.l06.e01
    type: matching
    prompt:
      pairs: [vocab.mehregan, vocab.boom, vocab.salkhord, vocab.nahofteh]
  - id: fereydoon.l06.e02
    type: sequencing
    difficulty: 2
    prompt:
      events:
        - id: a
          text: "فریدون در مهرماه تاج بر سر می‌نهد و مهرگان بنیاد می‌یابد"
        - id: b
          text: "پانصد سال فرمانروایی دادگرانه و آبادانی جهان"
        - id: c
          text: "سه پسر زاده می‌شوند و جهان به سه بخش می‌شود"
        - id: d
          text: "رشک برادران بر ایرج ریشه می‌دواند"
      correctOrder: [a, b, c, d]
  - id: fereydoon.l06.e03
    type: cloze
    difficulty: 2
    prompt:
      verseId: fereydoon.v012
      hemistich: 1
      blankToken: 3
      options: ["سالخورد", "کامگار", "خردمند"]
      correctIndex: 0
  - id: fereydoon.l06.e04
    type: comprehension
    prompt:
      question: "پندی که فردوسی در میانهٔ این داستان به خواننده می‌دهد چیست؟"
      options:
        - "آز مپرست و اندوه مخور، که جهان بر کسی نمی‌ماند"
        - "هرگز به سفر دور مرو"
        - "جز به فرزند خود اعتماد مکن"
      correctIndex: 0
  - id: fereydoon.l06.e05
    type: hemistichAssembly
    difficulty: 2
    prompt:
      verseId: fereydoon.v005
      hemistich: 2
      distractors: ["آباد"]
  - id: fereydoon.l06.e06
    type: comprehension
    prompt:
      question: "بیت مشهور «فریدون فرخ فرشته نبود» در چاپ مسکو کجا آمده است؟"
      options:
        - "در بخش ملحقات، نه متن اصلی"
        - "در آغاز داستان ضحاک"
        - "در دیباچهٔ شاهنامه"
      correctIndex: 0
  # TODO(editorial): M6 listening draft — distractor choices pending review.
  - id: fereydoon.l06.e07
    type: listening
    prompt:
      vocabId: vocab.salkhord
      options: ["سالخورد", "سالگرد", "شاگرد"]
      correctIndex: 0
