id: sohrab
position: 4
title: "رستم و سهراب"
subtitle: "تراژدی پدر و پسر"
summary: >-
  رخش گم می‌شود و رستم به سمنگان می‌رسد؛ تهمینه شبانه نزد او می‌آید و از این
  پیوند سهراب زاده می‌شود — پسری که پدر را هرگز ندیده است. سال‌ها بعد، پدر و
  پسر ناشناس در میدان جنگ رو‌به‌رو می‌شوند؛ و نوشدارو، آن‌گاه که می‌رسد،
  دیر رسیده است. تلخ‌ترین داستان شاهنامه.
