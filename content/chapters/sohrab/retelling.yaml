# Simplified prose retelling — original work. TODO(editorial): pending review.
sections:
  - id: sohrab.r01
    body: >-
      روزی رستم دل‌گرفته به شکار رفت و نزدیک مرز توران، پس از خوردن و
      آسودن، خوابش برد. رخش را سواران تورانی ربودند. رستم پیاده و خشمگین
      پی اسب تا شهر سمنگان رفت؛ شاه سمنگان او را گرامی داشت و مهمان کرد.
      شب‌هنگام، تهمینه — دختر شاه — به بالین او آمد: ماه‌رویی که آوازهٔ
      دلاوری رستم دل از او برده بود.
  - id: sohrab.r02
    body: >-
      رستم تهمینه را به آیین از پدرش خواستگاری کرد. بامداد، مهره‌ای را که
      بر بازو داشت به تهمینه سپرد و گفت: «اگر دختری آمد، بر گیسویش بدوز؛
      و اگر پسر، بر بازویش ببند — نشانِ پدر.» آنگاه رخشِ یافته را زین کرد
      و به ایران بازگشت. از آن پیوند، سهراب زاده شد: کودکی که در ده‌سالگی
      در توران هماوردی نداشت — و پدرش را جز در قصه‌ها نمی‌شناخت.
  - id: sohrab.r03
    body: >-
      سهرابِ نوجوان از مادر نامِ پدر را گرفت و سودایی در سر پروراند: با
      لشکری به ایران برود، پدر را بیابد، کاووس را براندازد و رستم را بر
      تخت بنشاند. افراسیاب که این خبر شنید، شادمانه لشکری همراهش کرد —
      اما به سردارانش پنهانی سپرد که نگذارند پدر و پسر یکدیگر را بشناسند؛
      باشد که این دو، هم را از پای درآورند.
  - id: sohrab.r04
    body: >-
      در دژ سپید و سپس در میدانِ اصلی، پدر و پسر ناشناس رو‌به‌رو شدند.
      سهراب بارها نشانی‌های پدر را در این پهلوانِ پیر می‌جست و می‌پرسید؛
      رستم نام خود را پنهان می‌کرد. سه بار کشتی گرفتند. بار دوم سهراب
      پیروز شد اما رستم با نیرنگی جان به در برد. در سومین کشتی، رستم پشت
      جوان را خم کرد و دشنه بر پهلویش زد — و آنگاه مهرهٔ بازوی او را دید.
  - id: sohrab.r05
    body: >-
      رستم گودرز را نزد کاووس فرستاد: «از آن نوشدارو که در گنج توست،
      بفرست — تا زخمی‌ام تندرست شود.» کاووس درنگ کرد؛ ترسید که رستم و
      سهرابِ نیرومند، فردا تاجش را بگیرند. نوشدارو دیر شد و سهراب رفت.
      از آن روز، «نوشدارو پس از مرگ سهراب» در زبان فارسی مَثَل شد. گودرز
      رستمِ شکسته را چنین تسلا داد: شکاریم یکسر همه پیش مرگ — سری زیر
      تاج و سری زیر ترگ.
