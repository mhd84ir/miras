# Chapter: پادشاهی جمشید
# Verse text verbatim from Ganjoor (public domain): /ferdousi/shahname/jamshid (sh1).
id: jamshid
position: 1
title: "پادشاهی جمشید"
subtitle: "شکوه، نوروز و بهای غرور"
summary: >-
  جمشید هفتصد سال بر جهان فرمان راند: جنگ‌افزار و جامه و پزشکی به مردم آموخت،
  تختی پرنده ساخت و نوروز را بنیاد نهاد. اما چون همه چیز به کام شد، «منی کرد»
  و فرّ ایزدی از او گسست — و راه برای ضحاک باز شد.
