exercises:
  - id: jamshid.l06.e01
    type: storySection
    prompt: { retellingId: jamshid.r01 }
  - id: jamshid.l06.e02
    type: storySection
    prompt: { retellingId: jamshid.r02 }
  - id: jamshid.l06.e03
    type: comprehension
    prompt:
      question: "نوروز در این داستان چگونه پدید آمد?"
      options:
        - "روزی که جمشید بر تخت پرنده در آسمان درخشید"
        - "روز پیروزی جمشید بر دیوان"
        - "روز ساخته شدن نخستین جامه"
      correctIndex: 0
  - id: jamshid.l06.e04
    type: storySection
    prompt: { retellingId: jamshid.r03 }
  - id: jamshid.l06.e05
    type: storySection
    prompt: { retellingId: jamshid.r04 }
  - id: jamshid.l06.e06
    type: comprehension
    prompt:
      question: "چرا فرّ ایزدی از جمشید گسست؟"
      options:
        - "چون خود را یگانه آفرینندهٔ هنرها خواند و ناسپاس شد"
        - "چون دیوان را به بردگی گرفت"
        - "چون نوروز را جشن گرفت"
      correctIndex: 0
  - id: jamshid.l06.e07
    type: sequencing
    difficulty: 2
    prompt:
      events:
        - id: a
          text: "جمشید جنگ‌افزار و جامه و پیشه‌ها را به مردم می‌آموزد"
        - id: b
          text: "تخت پرنده ساخته می‌شود و نوروز بنیاد می‌یابد"
        - id: c
          text: "جمشید «منی» می‌کند و خود را یگانه می‌بیند"
        - id: d
          text: "فرّ ایزدی می‌گسلد و ایران آشفته می‌شود"
      correctOrder: [a, b, c, d]
  - id: jamshid.l06.e08
    type: matching
    prompt:
      pairs: [vocab.mani, vocab.nasepas, vocab.haras, vocab.yadegar]
  - id: jamshid.l06.e09
    type: hemistichAssembly
    difficulty: 2
    prompt:
      verseId: jamshid.v009
      hemistich: 2
      distractors: ["هراس"]
