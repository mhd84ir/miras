# Simplified prose retelling — original work.
sections:
  - id: jamshid.r01
    body: >-
      جمشید، فرزند طهمورث، با فرّهٔ ایزدی بر تخت نشست و گفت: «هم شهریارم و هم
      موبد.» پنجاه سال آهن را نرم کرد و خود و زره و جوشن ساخت؛ پنجاه سال دیگر
      رشتن و بافتن جامه را به مردم آموخت. آنگاه مردمان را به گروه‌ها بخش کرد:
      پرستندگان و جنگاوران و برزگران و پیشه‌وران — تا هر کس کار خویش را
      بشناسد و جهان سامان گیرد.
  - id: jamshid.r02
    body: >-
      چون کارهای بزرگ به انجام رسید، جمشید تختی گوهرنشان ساخت و دیوان آن را
      از زمین به آسمان برداشتند. شاه چون خورشیدِ تابان در هوا نشسته بود؛
      مردمان بر او گوهر افشاندند و آن روز را «روز نو» — نوروز — خواندند.
      از آن روزگار، این جشن فرخنده برای ما یادگار مانده است.
  - id: jamshid.r03
    body: >-
      سیصد سال دیگر گذشت و در آن سال‌ها مردم نه مرگ دیدند و نه رنج. جهان
      یکسره فرمانبردار جمشید بود — تا آنکه شاه به تخت نگریست و در گیتی جز
      خویشتن کسی را ندید. «منی» کرد و ناسپاس شد؛ به بزرگان گفت: «هنر در
      جهان از من پدید آمد؛ خور و خواب و آرام‌تان از من است. جز من پادشا
      کیست؟»
  - id: jamshid.r04
    body: >-
      چون این سخن گفته شد، فرّ یزدان از او گسست. بزرگان از او برگشتند،
      سپاهیانش پراکنده شدند و هراس بر دل شاه نشست. بیست و سه سال ایران
      آشفته ماند و جمشیدِ بی‌فرّ هر روز ناتوان‌تر شد — تا بزرگانِ رمیده از
      او، سرانجام رو به فرمانروایی بیگانه آوردند: ضحاکِ ماردوش. و این،
      داستانِ فصل بعد است.
