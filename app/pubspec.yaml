name: miras
description: "Miras (میراث) — gamified learning app for Persian classical literature."
publish_to: 'none'
# 0.9.x = phase-1 beta; 1.0.0 after beta feedback.
version: 0.9.0+3

environment:
  sdk: ^3.12.2

dependencies:
  drift: ^2.34.0
  drift_flutter: ^0.3.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.0.1
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  flutter_timezone: ^5.1.0
  go_router: ^17.3.0
  intl: ^0.20.2
  just_audio: ^0.10.6
  path: ^1.9.1
  path_provider: ^2.1.6
  sqlite3: ^3.3.4
  timezone: ^0.11.1

dev_dependencies:
  build_runner: ^2.15.0
  drift_dev: ^2.34.0
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.3.0
flutter:
  uses-material-design: true
  generate: true

  assets:
    # Generated by tool/content_compiler (gitignored) — see docs/CONTENT_GUIDE.md.
    # Asset folders are not recursive, so audio/ needs its own entry.
    - assets/content/
    - assets/content/audio/
    # UI feedback sounds (committed app assets, not pack content).
    - assets/sfx/

  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
    - family: Estedad
      fonts:
        - asset: assets/fonts/Estedad-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Estedad-Bold.ttf
          weight: 700
    # Verse face (M0 decision — DESIGN_SYSTEM.md §3): classical Naskh for بیت display.
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
