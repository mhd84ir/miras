# Nginx — Miras GlitchTip (miras.tebtejarat.com)
#
# پیش‌نیاز DNS: A record برای miras → IP سرور
# نصب:
#   sudo cp deploy/glitchtip/nginx-miras.conf /etc/nginx/sites-available/miras.tebtejarat.com
#   sudo ln -sf /etc/nginx/sites-available/miras.tebtejarat.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# SSL:
#   sudo certbot --nginx -d miras.tebtejarat.com

server {
    listen 80;
    listen [::]:80;
    server_name miras.tebtejarat.com;

    client_max_body_size 20M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
